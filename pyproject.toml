[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wasp-lab"
version = "0.1.0"
description = "Interactive Lab for WASP Protocol Simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0.3",
    "numpy>=1.24.0"
]

[project.scripts]
wasp = "wasp_lab.__main__:main"
